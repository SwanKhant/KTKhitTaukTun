<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change password - Khittoktun</title><link rel="stylesheet" href="/css/app.css"></head>
<body data-page="change-password">
  <header class="app-header"><a class="brand" href="/"><span class="brand-mark">K</span><span><strong>KHITTOKTUN</strong><small data-i18n="company">Company</small></span></a><nav class="app-nav"><a href="/portal.html" data-i18n="portal">Portal</a><button class="link-button" data-logout data-i18n="signOut">Sign out</button><span class="language-switcher"><button type="button" data-language="en">EN</button><span>/</span><button type="button" data-language="my-MM">မြန်မာ</button></span></nav></header>
