<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - Khittoktun</title><link rel="stylesheet" href="/css/app.css"></head>
<body data-page="login">
  <header class="app-header"><a class="brand" href="/"><span class="brand-mark">K</span><span><strong>KHITTOKTUN</strong><small data-i18n="company">Company</small></span></a><nav class="app-nav"><a href="/" data-i18n="home">Home</a><span class="language-switcher"><button type="button" data-language="en">EN</button><span>/</span><button type="button" data-language="my-MM">မြန်မာ</button></span></nav></header>
  <main class="auth-shell"><section class="auth-card"><p class="eyebrow" data-i18n="securePortal">Secure portal</p><h1 data-i18n="signIn">Sign in</h1><p class="muted" data-i18n="loginDescription">Use your company account to continue.</p><form id="login-form" class="form-stack"><label><span data-i18n="emailAddress">Email address</span><input id="login-email" type="email" autocomplete="username" required></label><label><span data-i18n="password">Password</span><input id="login-password" type="password" autocomplete="current-password" required></label><label class="checkbox-row"><input id="login-remember" type="checkbox"><span data-i18n="rememberMe">Remember me</span></label><button class="button" type="submit" data-i18n="signIn">Sign in</button><p id="login-error" class="form-error" role="alert"></p></form><p class="auth-help" data-i18n="needAccess">Need access? Contact an administrator.</p></section></main>
  <script src="/js/app.js"></script>
</body>
</html>
